# OpenShell policy for the isolated EVE Evidence Hunter proof-of-boundary.
# It intentionally excludes the project's real .env, the host home directory,
# Docker socket, and all destinations except the gateway-host AI-Q candidate.
version: 1

filesystem_policy:
  include_workdir: false
  read_only:
    - /usr
    - /lib
    - /lib64
    - /bin
    - /etc
    - /proc
    - /dev/null
    - /dev/urandom
    - /opt/eve-hunter
  read_write:
    - /tmp

landlock:
  compatibility: hard_requirement

process:
  run_as_user: "10001"
  run_as_group: "10001"

network_policies:
  aiq_local_host:
    endpoints:
      - host: host.openshell.internal
        port: 8000
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: /v1/jobs/async/submit
          - allow:
              method: GET
              path: /v1/jobs/async/job/**
    binaries:
      - path: /usr/bin/curl
